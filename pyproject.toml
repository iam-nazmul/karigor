[project]
name = "karigor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "anthropic>=1.2.0",
    "beautifulsoup4>=4.15.0",
    "bitsandbytes>=0.50.2",
    "databricks-langchain>=0.20.0",
    "ddgs>=9.16.0",
    "google-search-results>=2.4.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.3.18",
    "langchain-amazon-nova>=1.0.1",
    "langchain-anthropic>=1.7.0",
    "langchain-cohere>=0.6.0",
    "langchain-core>=1.6.1",
    "langchain-deepseek>=1.1.0",
    "langchain-google-genai>=4.3.7",
    "langchain-google-vertexai>=3.2.4",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-litellm>=0.6.4",
    "langchain-mistralai>=1.1.6",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-openrouter>=0.2.8",
    "langchain-together>=0.4.0",
    "langchain-xai>=1.3.0",
    "langchainhub>=0.1.21",
    "numexpr>=2.14.2",
    "openai>=1.109.1",
    "python-dotenv>=1.2.3",
    "sentencepiece>=0.2.2",
    "text-generation>=0.7.0",
    "transformers>=4.57.6",
]

[project.scripts]
karigor = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
